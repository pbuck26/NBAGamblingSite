# Render Blueprint for the web app (free plan). The daily data job runs on
# GitHub Actions (.github/workflows/daily.yml), not here.
services:
  - type: web
    name: nba-gambling-site
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false   # Neon pooled connection string (from `neon env pull`)
      - key: DATABASE_URL_UNPOOLED
        sync: false   # Neon direct connection string, used to create tables
      - key: SESSION_COOKIE_SECURE
        value: "1"
